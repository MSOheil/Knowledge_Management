<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Government Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4472"/>
      <stop offset="50%" stop-color="#17365D"/>
      <stop offset="100%" stop-color="#0E223D"/>
    </linearGradient>

    <!-- Gold Accent Gradient: Royal Knowledge Star & Pages -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Turquoise Gradient: Isfahan Architecture Accent -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#246B8F"/>
      <stop offset="100%" stop-color="#154964"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#246B8F" stroke-width="6"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Isfahan Architectural Arch / Dome Contour (Background Silhouette) -->
  <path d="M176 380 V 260 C 176 190, 256 130, 256 130 C 256 130, 336 190, 336 260 V 380 Z" 
        fill="none" stroke="url(#tealGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

  <!-- Knowledge Tree Central Trunk / Spine -->
  <line x1="256" y1="210" x2="256" y2="380" stroke="#F59E0B" stroke-width="12" stroke-linecap="round"/>

  <!-- Open Book Base (Standard APQC / KM Symbol) -->
  <!-- Left Page -->
  <path d="M256 360 C 210 330, 140 330, 96 350 V 230 C 140 210, 210 210, 256 240 Z" 
        fill="url(#tealGrad)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
  <!-- Left Page Details -->
  <path d="M130 260 C 165 246, 215 246, 240 265" stroke="rgba(255,255,255,0.6)" stroke-width="6" stroke-linecap="round"/>
  <path d="M130 286 C 165 272, 215 272, 240 291" stroke="rgba(255,255,255,0.6)" stroke-width="6" stroke-linecap="round"/>
  <path d="M130 312 C 165 298, 215 298, 240 317" stroke="rgba(255,255,255,0.6)" stroke-width="6" stroke-linecap="round"/>

  <!-- Right Page -->
  <path d="M256 360 C 302 330, 372 330, 416 350 V 230 C 372 210, 302 210, 256 240 Z" 
        fill="url(#tealGrad)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
  <!-- Right Page Details -->
  <path d="M382 260 C 347 246, 297 246, 272 265" stroke="rgba(255,255,255,0.6)" stroke-width="6" stroke-linecap="round"/>
  <path d="M382 286 C 347 272, 297 272, 272 291" stroke="rgba(255,255,255,0.6)" stroke-width="6" stroke-linecap="round"/>
  <path d="M382 312 C 347 298, 297 298, 272 317" stroke="rgba(255,255,255,0.6)" stroke-width="6" stroke-linecap="round"/>

  <!-- Radiant 8-Point Star of Wisdom & Intellect (شمسه دانش ایرانی-اسلامی) -->
  <g transform="translate(256, 140) scale(1.1)" filter="url(#glow)">
    <!-- Star Polygon 1 -->
    <rect x="-34" y="-34" width="68" height="68" rx="8" fill="url(#goldGrad)" transform="rotate(0)"/>
    <!-- Star Polygon 2 (rotated 45 deg) -->
    <rect x="-34" y="-34" width="68" height="68" rx="8" fill="url(#goldGrad)" transform="rotate(45)"/>
    <!-- Inner Core Dot -->
    <circle cx="0" cy="0" r="16" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="8" fill="#17365D"/>
  </g>

  <!-- Radiant Light Rays from the Wisdom Star -->
  <path d="M256 80 V 62" stroke="#FDE68A" stroke-width="8" stroke-linecap="round"/>
  <path d="M256 200 V 214" stroke="#FDE68A" stroke-width="8" stroke-linecap="round"/>
  <path d="M196 140 H 178" stroke="#FDE68A" stroke-width="8" stroke-linecap="round"/>
  <path d="M316 140 H 334" stroke="#FDE68A" stroke-width="8" stroke-linecap="round"/>

  <!-- Rising Knowledge Tree Branches & Leaves -->
  <path d="M256 290 Q 210 270, 180 230" fill="none" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
  <circle cx="180" cy="230" r="8" fill="#FBBF24"/>

  <path d="M256 290 Q 302 270, 332 230" fill="none" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
  <circle cx="332" cy="230" r="8" fill="#FBBF24"/>
</svg>

