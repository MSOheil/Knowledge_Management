<div class="h-10 bg-slate-50/80 dark:bg-slate-900/90 border-b border-slate-200 dark:border-slate-800 flex items-center px-3 sm:px-6 overflow-x-auto no-scrollbar gap-1.5 backdrop-blur-xs select-none">
  @for (tab of layout.tabs(); track tab.id) {
    <div
      (click)="selectTab(tab)"
      [class.bg-white]="layout.activeTabId() === tab.id"
      [class.dark:bg-slate-800]="layout.activeTabId() === tab.id"
      [class.text-orange-700]="layout.activeTabId() === tab.id"
      [class.dark:text-orange-300]="layout.activeTabId() === tab.id"
      [class.shadow-2xs]="layout.activeTabId() === tab.id"
      [class.border-b-2]="layout.activeTabId() === tab.id"
      [class.border-b-orange-600]="layout.activeTabId() === tab.id"
      [class.font-bold]="layout.activeTabId() === tab.id"
      [class.text-slate-600]="layout.activeTabId() !== tab.id"
      [class.dark:text-slate-400]="layout.activeTabId() !== tab.id"
      class="group relative flex items-center gap-2 px-3 py-1.5 rounded-t-xl border-t border-s border-e border-transparent hover:border-slate-200 dark:hover:border-slate-700 hover:bg-white/60 dark:hover:bg-slate-800/60 text-xs cursor-pointer transition-all duration-150 shrink-0">
      
      @if (tab.icon) {
        <i [class]="tab.icon" class="text-xs"></i>
      }

      <span class="truncate max-w-[150px]">{{ tab.title }}</span>

      @if (tab.closable !== false) {
        <button
          type="button"
          (click)="closeTab(tab.id, $event)"
          title="بستن تب"
          class="w-4 h-4 rounded-full flex items-center justify-center text-slate-400 hover:text-rose-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors ms-1">
          <i class="pi pi-times text-[9px]"></i>
        </button>
      }
    </div>
  }
</div>
