<div class="space-y-6">
  <!-- Minimal Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <div class="flex items-center gap-2">
        <span class="p-2 rounded-xl bg-teal-500/10 text-teal-700 dark:text-teal-400">
          <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
        </span>
        <h1 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-slate-100">مدیریت دبیرخانه‌های تخصصی سازمانی</h1>
      </div>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
        تعریف دبیرخانه‌های معاونت‌ها و سازمان‌های شهرداری اصفهان جهت هدایت هوشمند جریان ارزیابی دانش
      </p>
    </div>

    <button
      (click)="openCreateModal()"
      type="button"
      class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-teal-700 hover:bg-teal-600 text-white shadow-xs transition-colors">
      <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      ثبت دبیرخانه تخصصی جدید
    </button>
  </div>

  <!-- Secretariat Table with Mobile Horizontal Scroll Safety -->
  <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-3 sm:p-5 shadow-xs overflow-x-auto">
    <app-table
      #tableRef
      [config]="tableConfig"
      (buttonClicked)="onAction($event)"
    ></app-table>
  </div>

  <!-- Create/Edit Modal with Responsive Ergonomics -->
  @if (isModalOpen()) {
    <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4">
      <div class="bg-white dark:bg-slate-900 rounded-2xl sm:rounded-3xl max-w-md w-full p-5 sm:p-6 shadow-xl border border-slate-200 dark:border-slate-800 space-y-4">
        <h3 class="text-sm sm:text-base font-bold text-slate-900 dark:text-slate-100">
          {{ isEditing() ? 'ویرایش مشخصات دبیرخانه' : 'ثبت دبیرخانه تخصصی جدید' }}
        </h3>

        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">نام دبیرخانه سازمانی</label>
            <input
              [(ngModel)]="currentItem().name"
              type="text"
              placeholder="مثال: دبیرخانه تخصصی شهرسازی و معماری"
              class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-hidden focus:ring-2 focus:ring-teal-500/20 focus:border-teal-600"
            />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">کد شناسایی یکتا</label>
            <input
              [(ngModel)]="currentItem().code"
              type="text"
              placeholder="مثال: SEC-URBAN"
              class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-hidden focus:ring-2 focus:ring-teal-500/20 focus:border-teal-600 font-mono text-end"
            />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">شرح ماموریت و قلمرو دانشی</label>
            <textarea
              [(ngModel)]="currentItem().description"
              rows="3"
              placeholder="توضیحات پیرامون سرفصل‌های تحت پوشش این دبیرخانه..."
              class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-hidden focus:ring-2 focus:ring-teal-500/20 focus:border-teal-600"
            ></textarea>
          </div>

          <div class="flex items-center gap-2 pt-1">
            <input
              [(ngModel)]="currentItem().isActive"
              type="checkbox"
              id="activeCheck"
              class="w-4 h-4 text-teal-600 rounded-sm"
            />
            <label for="activeCheck" class="text-xs font-semibold text-slate-700 dark:text-slate-300">
              دبیرخانه در گردش‌کارهای جاری فعال باشد
            </label>
          </div>
        </div>

        <div class="flex flex-col-reverse sm:flex-row items-stretch sm:items-center justify-end gap-2 pt-3 border-t border-slate-200 dark:border-slate-800">
          <button
            (click)="isModalOpen.set(false)"
            type="button"
            class="w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs font-semibold border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
            انصراف
          </button>
          <button
            (click)="saveSecretariat()"
            type="button"
            class="w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs font-bold bg-teal-700 text-white hover:bg-teal-600 transition-colors">
            ذخیره دبیرخانه
          </button>
        </div>
      </div>
    </div>
  }
</div>
