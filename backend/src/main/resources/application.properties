# ===================================================================
# Knowledge Management System — Backend Application Configuration
# ===================================================================

spring.application.name=knowledge-management
spring.main.allow-circular-references=true

# Server & HTTP Servlet Encoding (Strict UTF-8)
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Database Configuration (PostgreSQL Single Schema)
# Database name derives dynamically or falls back to demo
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:demo}?characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tehran

# Liquibase Database Migrations
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
spring.liquibase.default-schema=public

# JWT Security Configuration
jwt.enabled=true
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expireTime=432000000

# Logging
logging.level.root=INFO
logging.level.com.isfahan.km=DEBUG
logging.level.org.springframework.security=INFO
